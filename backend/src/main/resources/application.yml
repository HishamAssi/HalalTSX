spring:
  application:
    name: halaltsx-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/halaltsx}
    username: ${SPRING_DATASOURCE_USERNAME:halaltsx}
    password: ${SPRING_DATASOURCE_PASSWORD:halaltsx}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

server:
  port: 8080
  servlet:
    context-path: /api/v1

alphavantage:
  api-key: ${ALPHA_VANTAGE_API_KEY:demo}
  base-url: https://www.alphavantage.co/query
  rate-limit:
    requests-per-minute: 5

app:
  data-mode:
    mode: ${DATA_MODE:test}
    allow-runtime-switch: ${DATA_MODE_ALLOW_SWITCH:true}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      alphaVantage:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  ratelimiter:
    instances:
      alphaVantage:
        limitForPeriod: 5
        limitRefreshPeriod: 60s
        timeoutDuration: 5s

logging:
  level:
    com.halaltsx: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    io.github.resilience4j: INFO
