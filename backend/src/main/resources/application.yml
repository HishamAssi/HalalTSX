spring:
  application:
    name: halaltsx-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/halaltsx}
    username: ${SPRING_DATASOURCE_USERNAME:halaltsx}
    password: ${SPRING_DATASOURCE_PASSWORD:halaltsx}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: simple

server:
  port: 8080
  servlet:
    context-path: /api/v1

alphavantage:
  api-key: ${ALPHA_VANTAGE_API_KEY:demo}
  base-url: https://www.alphavantage.co/query
  rate-limit:
    requests-per-minute: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.halaltsx: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
