version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: halaltsx-postgres
    environment:
      POSTGRES_DB: halaltsx
      POSTGRES_USER: halaltsx
      POSTGRES_PASSWORD: halaltsx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halaltsx -d halaltsx"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halaltsx-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/halaltsx
      SPRING_DATASOURCE_USERNAME: halaltsx
      SPRING_DATASOURCE_PASSWORD: halaltsx
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: halaltsx-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
